services:
  ai-translation:
    build:
      context: .
      args:
        NEXT_PUBLIC_API_BASE_URL: http://localhost:8080/api/v1
    ports:
      - "8080:8080"   # Backend API
      - "9991:9991"   # XXL-JOB Executor
      - "3000:3000"   # Frontend
    env_file:
      - .env
    environment:
      - BACKEND_WORKERS=1
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/healthz"]
      interval: 10s
      timeout: 5s
      retries: 3
