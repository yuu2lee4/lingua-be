[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "ai-translation"
version = "0.1.0"
description = "Modern AI Translation Service built with FastAPI"
authors = [
    { name = "AI HUB Team" }
]
requires-python = ">=3.13"
dependencies = [
    # Claude Agent SDK - AI Agent 开发框架
    "claude-agent-sdk>=0.1.19",

    # Web 框架
    "fastapi>=0.104.0",
    "uvicorn[standard]>=0.24.0",

    # 数据验证和配置
    "pydantic>=2.5.0",
    "pydantic-settings>=2.1.0",

    # 配置管理
    "apollo-python-client>=0.0.1",

    # 日志记录
    "loguru>=0.7.0",

    # 文件上传和HTTP客户端
    "python-multipart>=0.0.6",
    "httpx>=0.25.0",

    # LLM 客户端
    "openai>=2.15.0",
    "anthropic>=0.76.0",
    "google-genai>=1.59.0",

    # 数据库
    "aiomysql>=0.2.0",

    # Lark SDK
    "lark-oapi>=1.0.0",

    # 数据处理
    "pandas>=2.0.0",

    # XXL-JOB 调度
    "pyxxl>=0.4.0",
]

[dependency-groups]
dev = [
    "pytest>=7.4.0",
    "pytest-asyncio>=0.21.0",
    "pytest-cov>=4.1.0",
    "black>=23.0.0",
    "ruff>=0.1.0",
    "mypy>=1.7.0",
    "pyright>=1.1.380",
]

[tool.black]
line-length = 88
target-version = ['py313']
include = '\.pyi?$'
extend-exclude = '''
/(
  # directories
  \.eggs
  | \.git
  | \.hg
  | \.mypy_cache
  | \.tox
  | \.venv
  | build
  | dist
)/
'''

[tool.ruff]
target-version = "py313"
line-length = 88
select = [
    "E",  # pycodestyle errors
    "W",  # pycodestyle warnings
    "F",  # pyflakes
    "I",  # isort
    "B",  # flake8-bugbear
    "C4", # flake8-comprehensions
    "UP", # pyupgrade
]
ignore = [
    "E501",  # line too long, handled by black
    "B008",  # do not perform function calls in argument defaults
    "C901",  # too complex
]

[tool.ruff.per-file-ignores]
"__init__.py" = ["F401"]

[tool.ruff.isort]
known-first-party = ["app"]

[tool.mypy]
python_version = "3.13"
check_untyped_defs = true
disallow_any_generics = true
disallow_untyped_defs = true
follow_imports = "silent"
strict_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
disallow_any_unimported = true
no_implicit_optional = true
show_error_codes = true

[[tool.mypy.overrides]]
module = "tests.*"
disallow_untyped_defs = false

[tool.pytest.ini_options]
minversion = "6.0"
addopts = "-ra -q --strict-markers --strict-config"
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
markers = [
    "slow: marks tests as slow",
    "integration: marks tests as integration tests",
]

[tool.coverage.run]
source = ["app"]
branch = true

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "if self.debug:",
    "if settings.DEBUG",
    "raise AssertionError",
    "raise NotImplementedError",
    "if 0:",
    "if __name__ == .__main__.:",
    "class .*\\bProtocol\\):",
    "@\\(abc\\.\\)?abstractmethod",
]

[tool.hatch.build.targets.wheel]
packages = ["app"]
